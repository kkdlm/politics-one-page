name: sync-from-cdn
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-cdn
  cancel-in-progress: false
jobs:
  sync:
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch html
        env:
          SRC: https://aka.doubaocdn.com/s/WjBGTpDKZ6
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o index.html "$SRC"
          size=$(stat -c%s index.html)
          echo "index-size=$size"
          if [ "$size" -lt 800000 ]; then echo "::error::html too small ($size)"; exit 1; fi
          grep -q "<!DOCTYPE html>" index.html || { echo "::error::not html"; exit 1; }
          v=$(grep -o "const VER='[0-9.]*'" index.html | head -1 | sed "s/const VER='//;s/'//")
          p=$(grep -o "const PATCH='[0-9]*'" index.html | head -1 | sed "s/const PATCH='//;s/'//")
          if [ -z "$v" ]; then echo "::error::VER not found"; exit 1; fi
          echo "VER=$v" >> "$GITHUB_ENV"
          echo "PATCH=${p:-0}" >> "$GITHUB_ENV"
      - name: fetch assets
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o apple-touch-icon.png "https://aka.doubaocdn.com/s/JivLuRNg9O"
          curl -fsSL --retry 3 -o icon-192.png "https://aka.doubaocdn.com/s/bIh88P41KD"
          curl -fsSL --retry 3 -o icon-512.png "https://aka.doubaocdn.com/s/pcV1UvPvBw"
          curl -fsSL --retry 3 -o manifest.webmanifest "https://aka.doubaocdn.com/s/Ny1WU86HoA"
          curl -fsSL --retry 3 -o startup-1290x2796.png "https://aka.doubaocdn.com/s/eGrp7Yiy8K"
          curl -fsSL --retry 3 -o startup-1179x2556.png "https://aka.doubaocdn.com/s/MKa0SjMgWU"
          curl -fsSL --retry 3 -o startup-1170x2532.png "https://aka.doubaocdn.com/s/Zu8H2V8eES"
          curl -fsSL --retry 3 -o sw.js "https://aka.doubaocdn.com/s/dMaO2yXPbM"
          grep -q "app-${VER}-p${PATCH}" sw.js || { echo "::error::sw cache name stale"; exit 1; }
          node --check sw.js
      - name: generate version.json (auto, in sync with index.html)
        run: |
          set -euo pipefail
          printf '{\n  "version": "%s",\n  "patch": %s,\n  "date": "%s"\n}\n' \
            "$VER" "${PATCH:-0}" "$(date -u +%Y-%m-%d)" > version.json
          cat version.json
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apple-touch-icon.png icon-192.png icon-512.png manifest.webmanifest startup-*.png sw.js version.json
          if git diff --cached --quiet; then echo "已是最新，跳过提交"; exit 0; fi
          git commit -m "更新 index.html v${VER} 补丁 ${PATCH} [skip ci]"
          for i in 1 2 3; do
            if git push; then echo "pushed (try $i)"; exit 0; fi
            git pull --rebase --autostash origin main || true
          done
          exit 1
